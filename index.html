<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="leftSide">
        <div class="picture">
            <div class="pictureTop">
                <img src="pictures/odin_logo.png" alt="odin project logo">
                <div>ODIN</div>
            </div>
            <div class="pictureBot">
                <div>
                    Photo by <a href="https://unsplash.com/de/@haliewestphoto">Halie West</a> on 
                    <a href="https://unsplash.com/de/fotos/grune-blattpflanze-in-nahaufnahme-25xggax4bSA">Unsplash</a>
                </div>
            </div>
        </div>
    </div>
    <div class="rightSide">
        <div class="riTop">
            <div>
                This is not a real online service! You know you need something like this in your life
                to help you realize your deepest dreams. Sign up now and get started.                
            </div>
            <div>You know you want to.</div>
        </div>
        <div class="riMid">
            <form>
                <legend>Let's do this</legend>
                <div class="firstRowForm">
                    <label for="firstName">FIRST NAME</label>
                    <input type="text" name="firstName" id="firstName">
                    <label for="lastName">LAST NAME</label>
                    <input type="text" name="lastName" id="lastName">
                </div>
                <div class="secondRowForm">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                    <label for="telNum">PHONE NUMBER</label>
                    <input type="number" name="telNum" id="telNum">
                </div>
                <div class="thirdRowForm">
                    <label for="pwd">PASSWORD</label>
                    <input type="password" name="pwd" id="pwd">
                    <label for="pwdConf">CONFIRM PASSWORD</label>
                    <input type="password" name="pwdConf" id="pwdConf">
                </div>
            </form>
        </div>
        <div class="riBot">
            <button>Create Account</button>
            <div>Already have an Account? <span>Log in</span></div>
        </div>
    </div>
</body>
</html>
